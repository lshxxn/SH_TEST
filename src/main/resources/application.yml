spring:
  application:
    name: kakao-news-bot
  config:
    # API 키 같은 비밀 값은 이 파일에 둡니다 (GitHub 에 올라가지 않음). 예시: secrets.properties.example
    # 윈도우 메모장이 이름 끝에 .txt 를 붙여 저장한 경우도 읽는다.
    import:
      - optional:file:./secrets.properties
      - optional:file:./secrets.properties.txt[.properties]

server:
  port: ${PORT:8080}
  # 기본은 이 컴퓨터에서만 접속 가능. 외부에 열 이유가 없다면 그대로 두세요.
  address: ${SERVER_ADDRESS:127.0.0.1}

newsbot:
  # /api/news/*, /kakao/login 보호용. 길고 임의적인 값으로 설정하세요.
  admin-token: ${NEWSBOT_ADMIN_TOKEN:}

  schedule:
    cron: "0 0 9 * * *"   # 초 분 시 일 월 요일 → 매일 09:00:00
    zone: Asia/Seoul

  news:
    max-items-per-section: 5
    lookback: 24h          # 24시간보다 오래된 기사는 제외
    more-link: https://news.google.com/home?hl=ko&gl=KR&ceid=KR:ko
    sections:
      - name: 주요 뉴스
        rss: https://news.google.com/rss?hl=ko&gl=KR&ceid=KR:ko
      - name: 정치
        keyword: 정치          # 키워드 → 구글 뉴스 최근 1일 검색
      - name: 경제
        rss: https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=ko&gl=KR&ceid=KR:ko
      - name: 국제
        rss: https://news.google.com/rss/headlines/section/topic/WORLD?hl=ko&gl=KR&ceid=KR:ko
      - name: IT·과학
        rss: https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=ko&gl=KR&ceid=KR:ko
      # 언론사 RSS 주소를 직접 넣어도 됩니다
      # - name: 언론사 이름
      #   rss: https://언론사-RSS-주소

  # 카카오톡 채널 챗봇 (카카오 i 오픈빌더 스킬 서버)
  # 스킬 URL: https://<터널 주소>/kakao/skill/news
  chatbot:
    enabled: ${NEWSBOT_CHATBOT_ENABLED:true}
    max-items: 5          # 카드에 넣을 기사 수 (최대 5)
    cache-ttl: 5m         # 같은 분야를 5분 안에 다시 물으면 방금 가져온 결과 사용
    skill-token: ${NEWSBOT_SKILL_TOKEN:}   # 설정하면 스킬 URL 끝에 ?token=값 을 붙여야 응답

  # 제미나이 AI 대화 (폴백 블록). 스킬 URL: https://<터널 주소>/kakao/skill/chat
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
    timeout: 3500ms        # 콜백이 없을 때 카카오 5초 제한 안에 답하도록
    callback-timeout: 45s  # 콜백을 켠 블록에서는 오래 기다려도 됨
    max-output-tokens: 400
    history-turns: 3       # 친구별로 기억할 최근 대화 수
    history-ttl: 30m
    system-prompt: |
      너는 카카오톡 채널 '오늘의 뉴스 클리핑'의 AI 도우미야.
      한국어로, 카카오톡에서 읽기 편하게 짧고 친절하게 답해.
      답은 3~5문장, 400자 이내로 하고 마크다운 표나 머리글(#)은 쓰지 마.
      너는 실시간 정보를 볼 수 없으니 오늘 뉴스는 아래 분야 버튼을 눌러 보라고 안내해.
      확실하지 않은 사실은 지어내지 말고 모른다고 말해.

  # (선택) 정적 뉴스 페이지 생성: --spring.profiles.active=site
  site:
    title: 오늘의 뉴스 클리핑
    page-url: ${NEWSBOT_SITE_PAGE_URL:}
    channel-url: ${NEWSBOT_CHANNEL_URL:}
    output-dir: ${NEWSBOT_SITE_OUTPUT_DIR:_site}

  # ① 나에게 보내기 (무료, 본인 카카오톡 '나와의 채팅'으로 수신)
  kakao:
    enabled: ${KAKAO_ENABLED:false}
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/kakao/callback}
    token-file: ${KAKAO_TOKEN_FILE:./data/kakao-token.json}

  # ② 카카오톡 채널 → 채널 친구에게 브랜드 메시지 (사업자·비즈니스 채널·유료)
  solapi:
    enabled: ${SOLAPI_ENABLED:false}
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    pf-id: ${SOLAPI_PF_ID:}
    from: ${SOLAPI_FROM:}
    recipients: ${SOLAPI_RECIPIENTS:}   # 01011112222,01033334444
    targeting: I
    disable-sms: true
    include-links: true
