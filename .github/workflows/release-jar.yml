name: 실행 파일(jar) 빌드

# 코드를 올릴 때마다 jar 를 빌드해 GitHub Release "latest" 에 올립니다.
# 서버는 이 파일을 내려받기만 하면 되므로 서버에서 빌드할 필요가 없습니다.
on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md", "deploy/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-jar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 테스트와 빌드
        run: ./mvnw -B -q package

      - name: Release "latest" 에 jar 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp target/kakao-news-bot-*.jar kakao-news-bot.jar
          sha256sum kakao-news-bot.jar > kakao-news-bot.jar.sha256
          NOTE="빌드 시각 $(date -u +%Y-%m-%dT%H:%MZ), 커밋 ${GITHUB_SHA::7}"
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest kakao-news-bot.jar kakao-news-bot.jar.sha256 --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit latest --notes "$NOTE" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest kakao-news-bot.jar kakao-news-bot.jar.sha256 \
              --title "최신 실행 파일" --notes "$NOTE" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
